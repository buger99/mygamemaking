<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈 나를 소개합니다! 🌈</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Gaegu', 'Jua', sans-serif;
      min-height: 100vh;
      background: linear-gradient(to bottom, #0b0f2e 0%, #1b1550 45%, #4a2a7a 75%, #c0587e 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      color: #333;
    }

    /* 🌃 도시 야경 배경 */
    .night {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: white;
      animation: twinkle ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 1; }
    }

    .moon {
      position: absolute;
      top: 6%;
      right: 8%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffbe0, #ffe9a3 60%, #f5d26b);
      box-shadow: 0 0 40px 12px rgba(255, 236, 160, 0.45);
    }

    .skyline {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38vh;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    .building {
      flex: 1;
      background: #120d2b;
      border-top: 2px solid #2b2160;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px 6px;
      align-content: start;
    }

    .window {
      height: 8px;
      border-radius: 1px;
      background: #241b4d;
    }

    .window.on {
      background: #ffd966;
      box-shadow: 0 0 6px #ffcc33;
      animation: flicker 6s ease-in-out infinite;
    }

    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      95%           { opacity: 0.4; }
    }

    /* 배경에 둥둥 떠다니는 이모지 */
    .floating {
      position: fixed;
      font-size: 2rem;
      opacity: 0.45;
      pointer-events: none;
      animation: floatUp linear infinite;
      z-index: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); }
      100% { transform: translateY(-20vh) rotate(360deg); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 16px 60px;
    }

    /* 맨 위 인사 카드 */
    .hero {
      background: white;
      border-radius: 32px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 12px 0 #ff6b9d, 0 0 40px rgba(255, 107, 157, 0.6);
      border: 5px solid #ff6b9d;
      margin-bottom: 40px;
    }

    .avatar {
      font-size: 6rem;
      display: inline-block;
      animation: bounce 1.5s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-20px) scale(1.1); }
    }

    .hello {
      font-family: 'Jua', sans-serif;
      font-size: 1.6rem;
      color: #ff6b9d;
      margin-top: 10px;
    }

    .name {
      font-family: 'Jua', sans-serif;
      font-size: clamp(2.4rem, 8vw, 4rem);
      background: linear-gradient(90deg, #ff4e50, #f9d423, #24c6dc, #a16bfe, #ff4e50);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 3s linear infinite, floaty 3s ease-in-out infinite;
      margin: 8px 0;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* 두둥실 떠다니기 */
    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-14px) rotate(2deg); }
    }

    .tagline {
      font-size: 1.5rem;
      color: #666;
    }

    /* 섹션 제목 */
    .section-title {
      font-family: 'Jua', sans-serif;
      font-size: 2.2rem;
      text-align: center;
      color: white;
      text-shadow: 0 0 10px #f093fb, 0 0 22px #a16bfe;
      margin-bottom: 24px;
    }

    /* 취미 카드들 */
    .hobbies {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .hobby {
      border-radius: 24px;
      padding: 28px 16px;
      text-align: center;
      color: white;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s;
      box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 0 24px rgba(255,255,255,0.15);
    }

    .hobby:hover {
      transform: translateY(-10px) rotate(-3deg) scale(1.05);
      box-shadow: 0 18px 0 rgba(0,0,0,0.15);
    }

    .hobby:nth-child(4n+1) { background: linear-gradient(135deg, #ff6b9d, #ff9a76); }
    .hobby:nth-child(4n+2) { background: linear-gradient(135deg, #4facfe, #00c6fb); }
    .hobby:nth-child(4n+3) { background: linear-gradient(135deg, #43e97b, #2ec4b6); }
    .hobby:nth-child(4n+4) { background: linear-gradient(135deg, #a16bfe, #f093fb); }

    .hobby-emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 10px;
    }

    .hobby-name {
      font-family: 'Jua', sans-serif;
      font-size: 1.7rem;
    }

    .hobby-desc {
      font-size: 1.25rem;
      margin-top: 6px;
      opacity: 0.95;
    }

    /* 재미있는 사실 */
    .facts {
      background: #fffbe6;
      border: 5px dashed #f9a825;
      border-radius: 28px;
      padding: 28px 24px;
      margin-bottom: 40px;
    }

    .facts ul { list-style: none; }

    .facts li {
      font-size: 1.5rem;
      padding: 10px 0;
      border-bottom: 2px dotted #ffe082;
    }

    .facts li:last-child { border-bottom: none; }

    /* 버튼 */
    .btn-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .party-btn {
      font-family: 'Jua', sans-serif;
      font-size: 1.8rem;
      padding: 16px 40px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff4e50, #f9d423);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 0 #c0392b;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .party-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #c0392b;
    }

    .hello-btn {
      background: linear-gradient(90deg, #4facfe, #a16bfe);
      box-shadow: 0 8px 0 #5b3db5;
    }

    .hello-btn:active {
      box-shadow: 0 2px 0 #5b3db5;
    }

    /* 버튼 누르면 터지는 이모지 */
    .confetti {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      z-index: 10;
      animation: pop 1.6s ease-out forwards;
    }

    @keyframes pop {
      0%   { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) scale(1.3) rotate(720deg); opacity: 0; }
    }

    footer {
      text-align: center;
      font-size: 1.3rem;
      color: white;
      margin-top: 40px;
      text-shadow: 0 0 8px rgba(0,0,0,0.6);
      background: rgba(11, 15, 46, 0.7);
      border-radius: 999px;
      padding: 10px 20px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    /* 📱 모바일 화면 */
    @media (max-width: 600px) {
      .container { padding: 24px 16px 40px; }
      .hero { padding: 28px 16px; border-radius: 24px; border-width: 4px; }
      .avatar { font-size: 4.5rem; }
      .hello { font-size: 1.3rem; }
      .tagline { font-size: 1.2rem; }
      .section-title { font-size: 1.7rem; }
      .hobbies { grid-template-columns: 1fr; gap: 16px; }
      .hobby { padding: 20px 16px; }
      .hobby-emoji { font-size: 3rem; }
      .hobby-name { font-size: 1.5rem; }
      .facts { padding: 18px 16px; border-width: 4px; }
      .facts li { font-size: 1.2rem; }
      .btn-area { flex-direction: column; gap: 16px; }
      .party-btn { width: 100%; font-size: 1.4rem; padding: 14px 20px; }
      .moon { width: 56px; height: 56px; top: 3%; }
      .skyline { height: 26vh; gap: 2px; }
      .building { gap: 4px; padding: 6px 3px; }
      .window { height: 5px; }
      .floating { font-size: 1.3rem !important; }
    }
  </style>
</head>
<body>

  <!-- 🌃 도시 야경 -->
  <div class="night" id="night">
    <div class="moon"></div>
    <div class="skyline" id="skyline"></div>
  </div>

  <div class="container">

    <!-- 👋 인사 -->
    <section class="hero">
      <div class="avatar" id="avatar" title="눌러보세요!">😎</div>
      <p class="hello">✨ 안녕하세요! 저는 ✨</p>
      <h1 class="name">🌟 정한별 🌟</h1>
      <p class="tagline">🎮 게임 만들기에 도전 중인 새내기 개발자예요! 🚀</p>
    </section>

    <!-- 💖 취미 -->
    <h2 class="section-title">💖 나의 취미 💖</h2>
    <section class="hobbies">
      <div class="hobby">
        <span class="hobby-emoji">🎮</span>
        <div class="hobby-name">게임</div>
        <div class="hobby-desc">하는 것도 좋고, 이제 직접 만들어 볼 거예요! 🕹️</div>
      </div>
      <div class="hobby">
        <span class="hobby-emoji">🎬</span>
        <div class="hobby-name">영화</div>
        <div class="hobby-desc">팝콘 🍿 들고 영화 보는 시간이 최고!</div>
      </div>
      <div class="hobby">
        <span class="hobby-emoji">🎵</span>
        <div class="hobby-name">노래</div>
        <div class="hobby-desc">듣는 것도 부르는 것도 좋아요 🎤🎶</div>
      </div>
    </section>

    <!-- 🤩 재미있는 사실 -->
    <h2 class="section-title">🤩 나에 대한 TMI 🤩</h2>
    <section class="facts">
      <ul>
        <li>🎮 쉬는 날엔 게임 한 판은 기본!</li>
        <li>🍿 영화 볼 때 팝콘은 필수예요</li>
        <li>🎧 노래 들으면서 코딩하는 중~</li>
        <li>💭 나의 꿈: <b>멋진 게임 만들기! 🕹️</b></li>
      </ul>
    </section>

    <!-- 🎉 버튼 -->
    <div class="btn-area">
      <button class="party-btn" id="partyBtn">🎉 파티 버튼! 눌러봐! 🎉</button>
      <button class="party-btn hello-btn" id="helloBtn">👋 인사하기 👋</button>
    </div>

    <footer>💌 방문해 주셔서 고마워요! 💌</footer>
  </div>

  <script>
    const EMOJIS = ['🎉', '🌈', '⭐', '💖', '🎈', '🍭', '🦄', '🌸', '✨', '🎮', '🍀', '🔥', '🐣', '🍩'];
    const randomEmoji = () => EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

    // 🌟 반짝이는 별 만들기
    const night = document.getElementById('night');
    for (let i = 0; i < 90; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 65 + '%';
      star.style.animationDuration = 1.5 + Math.random() * 3 + 's';
      star.style.animationDelay = -Math.random() * 4 + 's';
      night.appendChild(star);
    }

    // 🏙️ 빌딩과 불 켜진 창문 만들기
    const skyline = document.getElementById('skyline');
    const buildingCount = window.innerWidth < 600 ? 9 : 16;
    for (let i = 0; i < buildingCount; i++) {
      const b = document.createElement('div');
      b.className = 'building';
      b.style.height = 35 + Math.random() * 65 + '%';
      for (let w = 0; w < 36; w++) {
        const win = document.createElement('div');
        win.className = 'window' + (Math.random() < 0.45 ? ' on' : '');
        if (win.classList.contains('on')) win.style.animationDelay = -Math.random() * 6 + 's';
        b.appendChild(win);
      }
      skyline.appendChild(b);
    }

    // 배경에 떠다니는 이모지 만들기
    const NIGHT_EMOJIS = ['✨', '⭐', '🌟', '💫', '🎈', '🎆'];
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div');
      el.className = 'floating';
      el.textContent = NIGHT_EMOJIS[Math.floor(Math.random() * NIGHT_EMOJIS.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = 10 + Math.random() * 15 + 's';
      el.style.animationDelay = -Math.random() * 20 + 's';
      el.style.fontSize = 1.2 + Math.random() * 2 + 'rem';
      document.body.appendChild(el);
    }

    // 이모지 폭죽 터뜨리기
    function burst(x, y, count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.textContent = randomEmoji();
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist = 120 + Math.random() * 220;
        el.style.setProperty('--x', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--y', Math.sin(angle) * dist + 'px');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1600);
      }
    }

    document.getElementById('partyBtn').addEventListener('click', (e) => {
      burst(e.clientX, e.clientY, 30);
    });

    // 👋 인사 버튼을 누르면 알림 창이 떠요
    document.getElementById('helloBtn').addEventListener('click', () => {
      alert('반가워! 👋😊');
    });

    // 얼굴을 누르면 표정이 바뀌어요
    const faces = ['😎', '😆', '🤩', '😜', '🥳', '😺', '🤖', '👻'];
    let faceIndex = 0;
    const avatar = document.getElementById('avatar');
    avatar.addEventListener('click', (e) => {
      faceIndex = (faceIndex + 1) % faces.length;
      avatar.textContent = faces[faceIndex];
      burst(e.clientX, e.clientY, 10);
    });

    // 취미 카드를 누르면 작은 폭죽
    document.querySelectorAll('.hobby').forEach(card => {
      card.addEventListener('click', (e) => burst(e.clientX, e.clientY, 12));
    });
  </script>
</body>
</html>
