<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈 나를 소개합니다! 🌈</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Gaegu', 'Jua', sans-serif;
      min-height: 100vh;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb, #d4fc79, #fbc2eb);
      background-size: 400% 400%;
      animation: rainbowBg 12s ease infinite;
      overflow-x: hidden;
      color: #333;
    }

    @keyframes rainbowBg {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 배경에 둥둥 떠다니는 이모지 */
    .floating {
      position: fixed;
      font-size: 2rem;
      opacity: 0.6;
      pointer-events: none;
      animation: floatUp linear infinite;
      z-index: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); }
      100% { transform: translateY(-20vh) rotate(360deg); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 16px 60px;
    }

    /* 맨 위 인사 카드 */
    .hero {
      background: white;
      border-radius: 32px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 12px 0 #ff6b9d, 0 20px 40px rgba(0,0,0,0.15);
      border: 5px solid #ff6b9d;
      margin-bottom: 40px;
    }

    .avatar {
      font-size: 6rem;
      display: inline-block;
      animation: bounce 1.5s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-20px) scale(1.1); }
    }

    .hello {
      font-family: 'Jua', sans-serif;
      font-size: 1.6rem;
      color: #ff6b9d;
      margin-top: 10px;
    }

    .name {
      font-family: 'Jua', sans-serif;
      font-size: clamp(2.4rem, 8vw, 4rem);
      background: linear-gradient(90deg, #ff4e50, #f9d423, #24c6dc, #a16bfe, #ff4e50);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 3s linear infinite;
      margin: 8px 0;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .tagline {
      font-size: 1.5rem;
      color: #666;
    }

    /* 섹션 제목 */
    .section-title {
      font-family: 'Jua', sans-serif;
      font-size: 2.2rem;
      text-align: center;
      color: white;
      text-shadow: 3px 3px 0 #a16bfe, 6px 6px 0 rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }

    /* 취미 카드들 */
    .hobbies {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .hobby {
      border-radius: 24px;
      padding: 28px 16px;
      text-align: center;
      color: white;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s;
      box-shadow: 0 8px 0 rgba(0,0,0,0.15);
    }

    .hobby:hover {
      transform: translateY(-10px) rotate(-3deg) scale(1.05);
      box-shadow: 0 18px 0 rgba(0,0,0,0.15);
    }

    .hobby:nth-child(4n+1) { background: linear-gradient(135deg, #ff6b9d, #ff9a76); }
    .hobby:nth-child(4n+2) { background: linear-gradient(135deg, #4facfe, #00c6fb); }
    .hobby:nth-child(4n+3) { background: linear-gradient(135deg, #43e97b, #2ec4b6); }
    .hobby:nth-child(4n+4) { background: linear-gradient(135deg, #a16bfe, #f093fb); }

    .hobby-emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 10px;
    }

    .hobby-name {
      font-family: 'Jua', sans-serif;
      font-size: 1.7rem;
    }

    .hobby-desc {
      font-size: 1.25rem;
      margin-top: 6px;
      opacity: 0.95;
    }

    /* 재미있는 사실 */
    .facts {
      background: #fffbe6;
      border: 5px dashed #f9a825;
      border-radius: 28px;
      padding: 28px 24px;
      margin-bottom: 40px;
    }

    .facts ul { list-style: none; }

    .facts li {
      font-size: 1.5rem;
      padding: 10px 0;
      border-bottom: 2px dotted #ffe082;
    }

    .facts li:last-child { border-bottom: none; }

    /* 버튼 */
    .btn-area { text-align: center; }

    .party-btn {
      font-family: 'Jua', sans-serif;
      font-size: 1.8rem;
      padding: 16px 40px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff4e50, #f9d423);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 0 #c0392b;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .party-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #c0392b;
    }

    /* 버튼 누르면 터지는 이모지 */
    .confetti {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      z-index: 10;
      animation: pop 1.6s ease-out forwards;
    }

    @keyframes pop {
      0%   { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) scale(1.3) rotate(720deg); opacity: 0; }
    }

    footer {
      text-align: center;
      font-size: 1.3rem;
      color: white;
      margin-top: 40px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 👋 인사 -->
    <section class="hero">
      <div class="avatar" id="avatar" title="눌러보세요!">😎</div>
      <p class="hello">✨ 안녕하세요! 저는 ✨</p>
      <h1 class="name">🌟 [이름] 🌟</h1>
      <p class="tagline">🎮 게임 만들기에 도전 중인 새내기 개발자예요! 🚀</p>
    </section>

    <!-- 💖 취미 -->
    <h2 class="section-title">💖 나의 취미 💖</h2>
    <section class="hobbies">
      <div class="hobby">
        <span class="hobby-emoji">🎮</span>
        <div class="hobby-name">[취미 1]</div>
        <div class="hobby-desc">여기에 설명을 써요 ✏️</div>
      </div>
      <div class="hobby">
        <span class="hobby-emoji">🎵</span>
        <div class="hobby-name">[취미 2]</div>
        <div class="hobby-desc">여기에 설명을 써요 ✏️</div>
      </div>
      <div class="hobby">
        <span class="hobby-emoji">📚</span>
        <div class="hobby-name">[취미 3]</div>
        <div class="hobby-desc">여기에 설명을 써요 ✏️</div>
      </div>
      <div class="hobby">
        <span class="hobby-emoji">🍕</span>
        <div class="hobby-name">[취미 4]</div>
        <div class="hobby-desc">여기에 설명을 써요 ✏️</div>
      </div>
    </section>

    <!-- 🤩 재미있는 사실 -->
    <h2 class="section-title">🤩 나에 대한 TMI 🤩</h2>
    <section class="facts">
      <ul>
        <li>🌈 좋아하는 색깔: <b>[색깔]</b></li>
        <li>🍦 좋아하는 음식: <b>[음식]</b></li>
        <li>🐶 좋아하는 동물: <b>[동물]</b></li>
        <li>💭 나의 꿈: <b>멋진 게임 만들기! 🕹️</b></li>
      </ul>
    </section>

    <!-- 🎉 버튼 -->
    <div class="btn-area">
      <button class="party-btn" id="partyBtn">🎉 파티 버튼! 눌러봐! 🎉</button>
    </div>

    <footer>💌 방문해 주셔서 고마워요! 💌</footer>
  </div>

  <script>
    const EMOJIS = ['🎉', '🌈', '⭐', '💖', '🎈', '🍭', '🦄', '🌸', '✨', '🎮', '🍀', '🔥', '🐣', '🍩'];
    const randomEmoji = () => EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

    // 배경에 떠다니는 이모지 만들기
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'floating';
      el.textContent = randomEmoji();
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = 10 + Math.random() * 15 + 's';
      el.style.animationDelay = -Math.random() * 20 + 's';
      el.style.fontSize = 1.2 + Math.random() * 2 + 'rem';
      document.body.appendChild(el);
    }

    // 이모지 폭죽 터뜨리기
    function burst(x, y, count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.textContent = randomEmoji();
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist = 120 + Math.random() * 220;
        el.style.setProperty('--x', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--y', Math.sin(angle) * dist + 'px');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1600);
      }
    }

    document.getElementById('partyBtn').addEventListener('click', (e) => {
      burst(e.clientX, e.clientY, 30);
    });

    // 얼굴을 누르면 표정이 바뀌어요
    const faces = ['😎', '😆', '🤩', '😜', '🥳', '😺', '🤖', '👻'];
    let faceIndex = 0;
    const avatar = document.getElementById('avatar');
    avatar.addEventListener('click', (e) => {
      faceIndex = (faceIndex + 1) % faces.length;
      avatar.textContent = faces[faceIndex];
      burst(e.clientX, e.clientY, 10);
    });

    // 취미 카드를 누르면 작은 폭죽
    document.querySelectorAll('.hobby').forEach(card => {
      card.addEventListener('click', (e) => burst(e.clientX, e.clientY, 12));
    });
  </script>
</body>
</html>
