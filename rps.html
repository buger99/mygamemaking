<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>가위바위보!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    /* 픽셀 글씨체 (오락실 느낌) */
    @font-face {
      font-family: 'Galmuri11';
      src: url('fonts/Galmuri11.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      /* 밝은 사탕 오락실 팔레트 */
      --bg-top: #fff4d6;
      --bg-bottom: #ffd9e8;
      --cabinet: #ffffff;
      --ink: #3b2a55;
      --line: #3b2a55;
      --pink: #ff6fa5;
      --yellow: #ffd23f;
      --mint: #3ddbb0;
      --sky: #5ab8ff;
      --lilac: #b28dff;

      --font-pixel: 'Galmuri11', 'Jua', monospace;
      --font-round: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font-round);
      color: var(--ink);
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.7) 2px, transparent 2.5px) 0 0 / 28px 28px,
        linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      word-break: keep-all;
    }

    /* ───────── 🕹️ 오락실 기계 ───────── */
    .cabinet {
      width: 100%;
      max-width: 620px;
      background: var(--cabinet);
      border: 4px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 10px 0 var(--line), 0 18px 30px rgba(59, 42, 85, 0.18);
      padding: 28px 24px 32px;
      text-align: center;
      position: relative;
    }

    /* 기계 위쪽 반짝이 전구 줄 */
    .lights {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .lights span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--line);
      animation: blink 1.2s steps(1) infinite;
    }
    .lights span:nth-child(5n+1) { background: var(--pink); }
    .lights span:nth-child(5n+2) { background: var(--yellow); animation-delay: .2s; }
    .lights span:nth-child(5n+3) { background: var(--mint);   animation-delay: .4s; }
    .lights span:nth-child(5n+4) { background: var(--sky);    animation-delay: .6s; }
    .lights span:nth-child(5n+5) { background: var(--lilac);  animation-delay: .8s; }
    @keyframes blink { 50% { opacity: .3; } }

    /* ───────── 제목 ───────── */
    h1 {
      font-family: var(--font-pixel);
      font-size: clamp(2.2rem, 9vw, 3.6rem);
      line-height: 1.1;
      letter-spacing: 2px;
      color: var(--yellow);
      -webkit-text-stroke: 2px var(--line);
      paint-order: stroke fill;
      text-shadow: 4px 4px 0 var(--pink), 7px 7px 0 var(--line);
      margin-bottom: 8px;
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(-4px); } }

    .subtitle {
      font-family: var(--font-pixel);
      font-size: .95rem;
      color: var(--lilac);
      margin-bottom: 28px;
    }

    /* ───────── ✌️✊✋ 큰 버튼 3개 ───────── */
    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .choice {
      --c: var(--pink);
      font: inherit;
      color: var(--ink);
      background: var(--c);
      border: 4px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 8px 0 var(--line);
      padding: 18px 6px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform .08s, box-shadow .08s, filter .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice.scissors { --c: var(--pink); }
    .choice.rock     { --c: var(--yellow); }
    .choice.paper    { --c: var(--mint); }

    .choice .emoji {
      font-size: clamp(2.8rem, 13vw, 4.4rem);
      line-height: 1;
      filter: drop-shadow(0 3px 0 rgba(59, 42, 85, .25));
    }
    .choice .label {
      font-family: var(--font-pixel);
      font-size: clamp(1rem, 4vw, 1.3rem);
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 999px;
      padding: 2px 14px;
    }

    .choice:hover { filter: brightness(1.06); transform: translateY(-3px); box-shadow: 0 11px 0 var(--line); }
    .choice:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--line); }
    .choice:focus-visible { outline: 4px dashed var(--sky); outline-offset: 5px; }

    /* ───────── 결과 표시 영역 (아직 비어 있음) ───────── */
    .result {
      min-height: 140px;
      border: 4px dashed var(--line);
      border-radius: 20px;
      background:
        repeating-linear-gradient(0deg, rgba(90, 184, 255, .08) 0 2px, transparent 2px 6px),
        #f2f8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: var(--font-pixel);
      font-size: 1.1rem;
    }
    .result:empty::before {
      content: '버튼을 눌러 보세요!';
      color: rgba(59, 42, 85, .4);
      animation: blink 1.4s steps(1) infinite;
    }

    /* 결과: 나 vs 컴퓨터 */
    .result { flex-direction: column; gap: 12px; }
    .faceoff {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 5vw, 28px);
    }
    .hand { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .hand .who { font-size: .85rem; color: var(--lilac); }
    .hand .big { font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1.1; }
    .hand.cpu .big { font-size: clamp(3.6rem, 16vw, 5.2rem); animation: pop .35s ease-out; }
    .vs { font-size: 1.2rem; color: var(--pink); }
    .verdict {
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      padding: 4px 18px;
      border: 3px solid var(--line);
      border-radius: 999px;
      animation: pop .35s ease-out;
    }
    .verdict.win  { background: var(--yellow); }
    .verdict.lose { background: var(--sky); }
    .verdict.draw { background: var(--mint); }
    @keyframes pop {
      0% { transform: scale(.4); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ───────── 🏆 점수판 ───────── */
    .scoreboard {
      display: inline-flex;
      align-items: center;
      gap: clamp(10px, 3vw, 18px);
      font-family: var(--font-pixel);
      background: var(--ink);
      color: #fff;
      border-radius: 18px;
      padding: 10px clamp(16px, 5vw, 28px);
      margin: 6px 0 14px;
      box-shadow: inset 0 0 0 3px var(--lilac);
    }
    .scoreboard .side { font-size: clamp(1rem, 4vw, 1.25rem); }
    .scoreboard .num {
      font-size: clamp(2.2rem, 10vw, 3rem);
      line-height: 1;
      min-width: 1.2ch;
      display: inline-block;
    }
    .scoreboard .num.me  { color: var(--yellow); }
    .scoreboard .num.cpu { color: var(--sky); }
    .scoreboard .colon { font-size: clamp(1.8rem, 8vw, 2.4rem); color: var(--pink); }
    .scoreboard .num.bump { animation: pop .35s ease-out; }
    .goal { font-family: var(--font-pixel); font-size: .8rem; color: var(--lilac); margin-top: -6px; margin-bottom: 18px; }

    .choice:disabled { cursor: not-allowed; filter: grayscale(.6) opacity(.6); transform: none; box-shadow: 0 8px 0 var(--line); }

    /* ───────── 🎊 최종 승리 / 패배 화면 ───────── */
    .final {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      overflow: hidden;
      animation: fade .25s ease-out;
    }
    .final[hidden] { display: none; }
    .final .big-emoji { font-size: clamp(4rem, 20vw, 6.5rem); line-height: 1; animation: pop .5s ease-out; }
    .final h2 {
      font-family: var(--font-pixel);
      font-size: clamp(2rem, 9vw, 3.2rem);
      line-height: 1.15;
      -webkit-text-stroke: 2px var(--line);
      paint-order: stroke fill;
      text-shadow: 4px 4px 0 var(--line);
      animation: pop .5s ease-out;
    }
    .final.win  h2 { color: var(--yellow); }
    .final.lose h2 { color: var(--sky); }
    .final .final-score { font-family: var(--font-pixel); font-size: 1.15rem; }
    .again {
      font-family: var(--font-pixel);
      font-size: 1.3rem;
      color: var(--ink);
      background: var(--pink);
      border: 4px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 6px 0 var(--line);
      padding: 10px 28px;
      margin-top: 6px;
      cursor: pointer;
      transition: transform .08s, box-shadow .08s;
    }
    .again:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--line); }
    .again:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--line); }
    .again:focus-visible { outline: 4px dashed var(--sky); outline-offset: 5px; }
    @keyframes fade { from { opacity: 0; } }

    /* 축하 꽃가루 */
    .confetti {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 14px;
      border: 2px solid var(--line);
      border-radius: 3px;
      animation: fall linear forwards;
      pointer-events: none;
    }
    @keyframes fall { to { transform: translateY(var(--drop)) rotate(720deg); } }

    @media (max-width: 420px) {
      .cabinet { padding: 22px 14px 26px; border-radius: 22px; }
      .choices { gap: 10px; }
      .choice { border-radius: 18px; padding: 14px 4px 12px; }
      .choice .label { padding: 2px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <div class="lights" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <h1>가위바위보!</h1>

    <div class="scoreboard" role="status" aria-label="점수">
      <span class="side">나</span>
      <span class="num me" id="score-me">0</span>
      <span class="colon">:</span>
      <span class="num cpu" id="score-cpu">0</span>
      <span class="side">컴퓨터</span>
    </div>
    <p class="goal">★ 먼저 3점 내면 최종 승리 ★</p>
    <p class="subtitle">▶ 하나를 골라 주세요 ◀</p>

    <section class="choices" aria-label="가위바위보 선택">
      <button class="choice scissors" type="button" data-choice="scissors">
        <span class="emoji" aria-hidden="true">✌️</span>
        <span class="label">가위</span>
      </button>
      <button class="choice rock" type="button" data-choice="rock">
        <span class="emoji" aria-hidden="true">✊</span>
        <span class="label">바위</span>
      </button>
      <button class="choice paper" type="button" data-choice="paper">
        <span class="emoji" aria-hidden="true">✋</span>
        <span class="label">보</span>
      </button>
    </section>

    <!-- 결과 표시 영역 -->
    <div class="result" id="result" aria-live="polite"></div>

    <!-- 최종 승리 / 패배 화면 -->
    <div class="final" id="final" role="dialog" aria-modal="true" aria-labelledby="final-title" hidden>
      <div class="big-emoji" id="final-emoji" aria-hidden="true"></div>
      <h2 id="final-title"></h2>
      <p class="final-score" id="final-score"></p>
      <button class="again" type="button" id="again">다시 하기 ↺</button>
    </div>
  </main>

  <script>
    const HANDS = {
      scissors: { emoji: '✌️', name: '가위', beats: 'paper' },
      rock:     { emoji: '✊', name: '바위', beats: 'scissors' },
      paper:    { emoji: '✋', name: '보',   beats: 'rock' },
    };
    const VERDICTS = {
      win:  '이겼다! 🎉',
      lose: '졌다… 😭',
      draw: '비겼다 🤝',
    };
    const WIN_SCORE = 3;
    const result = document.getElementById('result');
    const scoreMeEl = document.getElementById('score-me');
    const scoreCpuEl = document.getElementById('score-cpu');
    const finalEl = document.getElementById('final');
    const againBtn = document.getElementById('again');
    const choiceBtns = document.querySelectorAll('.choice');
    const cabinet = document.querySelector('.cabinet');
    let score = { me: 0, cpu: 0 };

    function bump(el, value) {
      el.textContent = value;
      el.classList.remove('bump');
      void el.offsetWidth; // 애니메이션 다시 시작
      el.classList.add('bump');
    }

    function showFinal() {
      const won = score.me >= WIN_SCORE;
      finalEl.className = 'final ' + (won ? 'win' : 'lose');
      document.getElementById('final-emoji').textContent = won ? '🏆' : '😵';
      document.getElementById('final-title').textContent = won ? '최종 승리!' : '최종 패배…';
      document.getElementById('final-score').textContent =
        `나 ${score.me} : ${score.cpu} 컴퓨터` + (won ? ' 🎉' : ' 다음엔 이길 거야!');
      finalEl.hidden = false;
      choiceBtns.forEach(b => b.disabled = true);
      if (won) confetti();
      againBtn.focus();
    }

    function confetti() {
      const colors = ['--pink', '--yellow', '--mint', '--sky', '--lilac'];
      for (let i = 0; i < 40; i++) {
        const c = document.createElement('span');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = `var(${colors[i % colors.length]})`;
        c.style.setProperty('--drop', (cabinet.offsetHeight + 40) + 'px');
        c.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
        c.style.animationDelay = Math.random() * .6 + 's';
        c.addEventListener('animationend', () => c.remove());
        finalEl.appendChild(c);
      }
    }

    function resetGame() {
      score = { me: 0, cpu: 0 };
      scoreMeEl.textContent = 0;
      scoreCpuEl.textContent = 0;
      result.innerHTML = '';
      finalEl.hidden = true;
      finalEl.querySelectorAll('.confetti').forEach(c => c.remove());
      choiceBtns.forEach(b => b.disabled = false);
      choiceBtns[0].focus();
    }
    againBtn.addEventListener('click', resetGame);

    function judge(me, cpu) {
      if (me === cpu) return 'draw';
      return HANDS[me].beats === cpu ? 'win' : 'lose';
    }

    document.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => {
        const me = btn.dataset.choice;
        const keys = Object.keys(HANDS);
        const cpu = keys[Math.floor(Math.random() * keys.length)];
        const outcome = judge(me, cpu);

        result.innerHTML = `
          <div class="faceoff">
            <div class="hand me">
              <span class="who">나</span>
              <span class="big" aria-hidden="true">${HANDS[me].emoji}</span>
              <span class="who">${HANDS[me].name}</span>
            </div>
            <span class="vs">VS</span>
            <div class="hand cpu">
              <span class="who">컴퓨터</span>
              <span class="big" aria-hidden="true">${HANDS[cpu].emoji}</span>
              <span class="who">${HANDS[cpu].name}</span>
            </div>
          </div>
          <div class="verdict ${outcome}">${VERDICTS[outcome]}</div>
        `;

        if (outcome === 'win') bump(scoreMeEl, ++score.me);
        if (outcome === 'lose') bump(scoreCpuEl, ++score.cpu);

        if (score.me >= WIN_SCORE || score.cpu >= WIN_SCORE) {
          // 마지막 판 결과를 잠깐 보여준 뒤 최종 화면
          choiceBtns.forEach(b => b.disabled = true);
          setTimeout(showFinal, 900);
        }
      });
    });
  </script>
</body>
</html>
