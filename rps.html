<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>가위바위보!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    /* 픽셀 글씨체 (오락실 느낌) */
    @font-face {
      font-family: 'Galmuri11';
      src: url('fonts/Galmuri11.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      /* 밝은 사탕 오락실 팔레트 */
      --bg-top: #fff4d6;
      --bg-bottom: #ffd9e8;
      --cabinet: #ffffff;
      --ink: #3b2a55;
      --line: #3b2a55;
      --pink: #ff6fa5;
      --yellow: #ffd23f;
      --mint: #3ddbb0;
      --sky: #5ab8ff;
      --lilac: #b28dff;

      --font-pixel: 'Galmuri11', 'Jua', monospace;
      --font-round: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font-round);
      color: var(--ink);
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.7) 2px, transparent 2.5px) 0 0 / 28px 28px,
        linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      word-break: keep-all;
    }

    /* ───────── 🕹️ 오락실 기계 ───────── */
    .cabinet {
      width: 100%;
      max-width: 620px;
      background: var(--cabinet);
      border: 4px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 10px 0 var(--line), 0 18px 30px rgba(59, 42, 85, 0.18);
      padding: 28px 24px 32px;
      text-align: center;
      position: relative;
    }

    /* 기계 위쪽 반짝이 전구 줄 */
    .lights {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .lights span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--line);
      animation: blink 1.2s steps(1) infinite;
    }
    .lights span:nth-child(5n+1) { background: var(--pink); }
    .lights span:nth-child(5n+2) { background: var(--yellow); animation-delay: .2s; }
    .lights span:nth-child(5n+3) { background: var(--mint);   animation-delay: .4s; }
    .lights span:nth-child(5n+4) { background: var(--sky);    animation-delay: .6s; }
    .lights span:nth-child(5n+5) { background: var(--lilac);  animation-delay: .8s; }
    @keyframes blink { 50% { opacity: .3; } }

    /* ───────── 제목 ───────── */
    h1 {
      font-family: var(--font-pixel);
      font-size: clamp(2.2rem, 9vw, 3.6rem);
      line-height: 1.1;
      letter-spacing: 2px;
      color: var(--yellow);
      -webkit-text-stroke: 2px var(--line);
      paint-order: stroke fill;
      text-shadow: 4px 4px 0 var(--pink), 7px 7px 0 var(--line);
      margin-bottom: 8px;
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(-4px); } }

    .subtitle {
      font-family: var(--font-pixel);
      font-size: .95rem;
      color: var(--lilac);
      margin-bottom: 28px;
    }

    /* ───────── ✌️✊✋ 큰 버튼 3개 ───────── */
    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .choice {
      --c: var(--pink);
      font: inherit;
      color: var(--ink);
      background: var(--c);
      border: 4px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 8px 0 var(--line);
      padding: 18px 6px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform .08s, box-shadow .08s, filter .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice.scissors { --c: var(--pink); }
    .choice.rock     { --c: var(--yellow); }
    .choice.paper    { --c: var(--mint); }

    .choice .emoji {
      font-size: clamp(2.8rem, 13vw, 4.4rem);
      line-height: 1;
      filter: drop-shadow(0 3px 0 rgba(59, 42, 85, .25));
    }
    .choice .label {
      font-family: var(--font-pixel);
      font-size: clamp(1rem, 4vw, 1.3rem);
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 999px;
      padding: 2px 14px;
    }

    .choice:hover { filter: brightness(1.06); transform: translateY(-3px); box-shadow: 0 11px 0 var(--line); }
    .choice:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--line); }
    .choice:focus-visible { outline: 4px dashed var(--sky); outline-offset: 5px; }

    /* ───────── 결과 표시 영역 (아직 비어 있음) ───────── */
    .result {
      min-height: 140px;
      border: 4px dashed var(--line);
      border-radius: 20px;
      background:
        repeating-linear-gradient(0deg, rgba(90, 184, 255, .08) 0 2px, transparent 2px 6px),
        #f2f8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: var(--font-pixel);
      font-size: 1.1rem;
    }
    .result:empty::before {
      content: '버튼을 눌러 보세요!';
      color: rgba(59, 42, 85, .4);
      animation: blink 1.4s steps(1) infinite;
    }

    /* 결과: 나 vs 컴퓨터 */
    .result { flex-direction: column; gap: 12px; }
    .faceoff {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 5vw, 28px);
    }
    .hand { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .hand .who { font-size: .85rem; color: var(--lilac); }
    .hand .big { font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1.1; }
    .hand.cpu .big { font-size: clamp(3.6rem, 16vw, 5.2rem); animation: pop .35s ease-out; }
    .vs { font-size: 1.2rem; color: var(--pink); }
    .verdict {
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      padding: 4px 18px;
      border: 3px solid var(--line);
      border-radius: 999px;
      animation: pop .35s ease-out;
    }
    .verdict.win  { background: var(--yellow); }
    .verdict.lose { background: var(--sky); }
    .verdict.draw { background: var(--mint); }
    @keyframes pop {
      0% { transform: scale(.4); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ───────── 🏆 점수판 ───────── */
    .scoreboard {
      display: inline-flex;
      align-items: center;
      gap: clamp(10px, 3vw, 18px);
      font-family: var(--font-pixel);
      background: var(--ink);
      color: #fff;
      border-radius: 18px;
      padding: 10px clamp(16px, 5vw, 28px);
      margin: 6px 0 14px;
      box-shadow: inset 0 0 0 3px var(--lilac);
    }
    .scoreboard .side { font-size: clamp(1rem, 4vw, 1.25rem); }
    .scoreboard .num {
      font-size: clamp(2.2rem, 10vw, 3rem);
      line-height: 1;
      min-width: 1.2ch;
      display: inline-block;
    }
    .scoreboard .num.me  { color: var(--yellow); }
    .scoreboard .num.cpu { color: var(--sky); }
    .scoreboard .colon { font-size: clamp(1.8rem, 8vw, 2.4rem); color: var(--pink); }
    .scoreboard .num.bump { animation: pop .35s ease-out; }
    .goal { font-family: var(--font-pixel); font-size: .8rem; color: var(--lilac); margin-top: -6px; margin-bottom: 18px; }

    .choice:disabled { cursor: not-allowed; filter: grayscale(.6) opacity(.6); transform: none; box-shadow: 0 8px 0 var(--line); }

    /* ───────── 🎊 최종 승리 / 패배 화면 ───────── */
    .final {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      overflow: hidden;
      animation: fade .25s ease-out;
    }
    .final[hidden] { display: none; }
    .final .big-emoji { font-size: clamp(4rem, 20vw, 6.5rem); line-height: 1; animation: pop .5s ease-out; }
    .final h2 {
      font-family: var(--font-pixel);
      font-size: clamp(2rem, 9vw, 3.2rem);
      line-height: 1.15;
      -webkit-text-stroke: 2px var(--line);
      paint-order: stroke fill;
      text-shadow: 4px 4px 0 var(--line);
      animation: pop .5s ease-out;
    }
    .final.win  h2 { color: var(--yellow); }
    .final.lose h2 { color: var(--sky); }
    .final .final-score { font-family: var(--font-pixel); font-size: 1.15rem; }
    .again {
      font-family: var(--font-pixel);
      font-size: 1.3rem;
      color: var(--ink);
      background: var(--pink);
      border: 4px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 6px 0 var(--line);
      padding: 10px 28px;
      margin-top: 6px;
      cursor: pointer;
      transition: transform .08s, box-shadow .08s;
    }
    .again:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--line); }
    .again:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--line); }
    .again:focus-visible { outline: 4px dashed var(--sky); outline-offset: 5px; }
    @keyframes fade { from { opacity: 0; } }

    /* ───────── 🎉 색종이 폭죽 ───────── */
    .fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
    }
    .piece {
      position: absolute;
      width: var(--size);
      height: calc(var(--size) * 1.4);
      margin: calc(var(--size) * -.7) 0 0 calc(var(--size) * -.5);
      background: var(--c);
      border: 2px solid var(--line);
      border-radius: 3px;
      animation: burst var(--dur) cubic-bezier(.15, .7, .4, 1) forwards;
    }
    .piece.round { border-radius: 50%; height: var(--size); }
    .piece.star {
      background: none;
      border: 0;
      color: var(--c);
      font-size: calc(var(--size) * 2);
      line-height: 1;
      -webkit-text-stroke: 1.5px var(--line);
    }
    .piece.star::before { content: '★'; }
    @keyframes burst {
      0%   { transform: translate(0, 0) scale(.2) rotate(0); opacity: 1; }
      35%  { transform: translate(var(--dx), var(--dy)) scale(1) rotate(calc(var(--rot) * .4)); }
      85%  { opacity: 1; }
      100% { transform: translate(calc(var(--dx) * 1.35), calc(var(--dy) + 60vh)) scale(.9) rotate(var(--rot)); opacity: 0; }
    }

    /* 이긴 판: 기계가 노랗게 번쩍 */
    .cabinet.flash-win { animation: glow .6s ease-out; }
    @keyframes glow {
      0%   { box-shadow: 0 10px 0 var(--line), 0 0 0 0 rgba(255, 210, 63, .9); }
      100% { box-shadow: 0 10px 0 var(--line), 0 0 0 40px rgba(255, 210, 63, 0); }
    }

    /* 진 판: 기계가 덜컹덜컹 흔들림 + 빨간 번쩍 */
    .cabinet::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: #ff4d6d;
      opacity: 0;
      pointer-events: none;
    }
    .cabinet.shake { animation: shake .45s cubic-bezier(.36, .07, .19, .97); }
    .cabinet.shake::after { animation: hurt .45s ease-out; }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px) rotate(-.3deg); }
      20%, 80% { transform: translateX(5px) rotate(.5deg); }
      30%, 50%, 70% { transform: translateX(-9px) rotate(-.8deg); }
      40%, 60% { transform: translateX(9px) rotate(.8deg); }
    }
    @keyframes hurt { 0% { opacity: .22; } 100% { opacity: 0; } }

    /* ───────── 🏆 최종 승리 화면 꾸미기 ───────── */
    .final > * { position: relative; z-index: 1; }
    .final.win {
      background: radial-gradient(circle at 50% 42%, #fffbe6 0 28%, #ffe9f2 70%);
      border: 6px dotted var(--pink);
      animation: fade .25s ease-out, bulbs .5s steps(1) infinite;
    }
    @keyframes bulbs { 50% { border-color: var(--yellow); } }
    /* 뒤에서 빙글빙글 도는 햇살 */
    .final.win::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 40%;
      width: 260vmax;
      height: 260vmax;
      margin: -130vmax 0 0 -130vmax;
      background: repeating-conic-gradient(rgba(255, 210, 63, .32) 0 10deg, transparent 10deg 20deg);
      animation: spin 14s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .champ {
      font-family: var(--font-pixel);
      font-size: .9rem;
      letter-spacing: 3px;
      color: #fff;
      background: var(--ink);
      border-radius: 6px;
      padding: 4px 12px;
    }
    .final:not(.win) .champ, .final:not(.win) .sparkle { display: none; }

    .final.win .big-emoji {
      font-size: clamp(5.5rem, 26vw, 8.5rem);
      filter: drop-shadow(0 0 18px rgba(255, 210, 63, .95)) drop-shadow(0 6px 0 rgba(59, 42, 85, .35));
      animation: trophy-in .7s cubic-bezier(.2, 1.6, .4, 1), trophy-bob 1.4s ease-in-out .7s infinite;
    }
    @keyframes trophy-in { 0% { transform: translateY(-60px) scale(.2) rotate(-25deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
    @keyframes trophy-bob { 50% { transform: translateY(-8px) rotate(4deg); } }

    .final.win h2 {
      font-size: clamp(2.4rem, 11vw, 3.8rem);
      text-shadow: 4px 4px 0 var(--pink), 7px 7px 0 var(--line);
      animation: pop .5s ease-out, rainbow 1.2s steps(1) infinite;
    }
    @keyframes rainbow {
      0%  { color: var(--yellow); }
      25% { color: var(--mint); }
      50% { color: var(--sky); }
      75% { color: #fff; }
    }

    .sparkle {
      position: absolute;
      font-size: clamp(1.4rem, 6vw, 2rem);
      animation: twinkle 1.1s ease-in-out infinite;
    }
    .sparkle:nth-of-type(1) { left: 12%; top: 14%; }
    .sparkle:nth-of-type(2) { right: 12%; top: 20%; animation-delay: .3s; }
    .sparkle:nth-of-type(3) { left: 16%; bottom: 22%; animation-delay: .6s; }
    .sparkle:nth-of-type(4) { right: 15%; bottom: 16%; animation-delay: .15s; }
    @keyframes twinkle { 50% { transform: scale(.4) rotate(45deg); opacity: .3; } }

    .final.lose { background: rgba(232, 240, 255, .94); }
    .final.lose .big-emoji { animation: pop .5s ease-out, wobble 1s ease-in-out .5s infinite; }
    @keyframes wobble { 50% { transform: rotate(-8deg); } }

    /* ───────── 🔥 연승 + ⏱️ 스피드 모드 줄 ───────── */
    .status-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .streak, .speed-toggle {
      font-family: var(--font-pixel);
      font-size: .95rem;
      color: var(--ink);
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 999px;
      padding: 5px 14px;
      box-shadow: 0 4px 0 var(--line);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .streak small { font-size: .75rem; color: var(--lilac); }
    .streak small b { font-weight: normal; }
    .streak.hot {
      color: #fff;
      background: linear-gradient(90deg, #ff5f3a, #ffb238, #ff5f3a) 0 0 / 200% 100%;
      animation: flame 1.2s linear infinite;
    }
    .streak.hot small { color: #fff3c4; }
    .streak.bump { animation: pop .35s ease-out; }
    .streak.hot.bump { animation: pop .35s ease-out, flame 1.2s linear infinite; }
    @keyframes flame { to { background-position: -200% 0; } }

    .speed-toggle { cursor: pointer; transition: transform .08s, box-shadow .08s; }
    .speed-toggle .state {
      font-size: .75rem;
      background: #e9e3f3;
      border-radius: 6px;
      padding: 1px 6px;
    }
    .speed-toggle[aria-checked="true"] { background: var(--sky); }
    .speed-toggle[aria-checked="true"] .state { background: var(--ink); color: var(--yellow); }
    .speed-toggle:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
    .speed-toggle:focus-visible { outline: 4px dashed var(--pink); outline-offset: 3px; }

    /* 카운트다운 (스피드 모드일 때 안내 문구 대신 보임) */
    .timer { display: none; }
    .cabinet.speed .subtitle { display: none; }
    .cabinet.speed .timer {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 360px;
      margin: 0 auto 22px;
      font-family: var(--font-pixel);
    }
    .timer-num {
      min-width: 2.6em;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--sky);
      -webkit-text-stroke: 1.5px var(--line);
      paint-order: stroke fill;
    }
    .timer-num.bump { animation: pop .3s ease-out; }
    .timer-track {
      flex: 1;
      height: 18px;
      background: #eef2fb;
      border: 3px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      background: repeating-linear-gradient(-45deg, var(--mint) 0 8px, #6fe8c6 8px 16px);
      transform-origin: left;
    }
    .timer.hurry .timer-num { color: #ff4d6d; }
    .timer.hurry .timer-bar { background: repeating-linear-gradient(-45deg, #ff4d6d 0 8px, #ff7b93 8px 16px); }
    .timer.hurry .timer-track { animation: shake .3s infinite; }

    /* 🤖 수다쟁이 컴퓨터 말풍선 */
    .talk { display: flex; align-items: center; gap: 10px; max-width: 100%; }
    .talk .bot { font-size: 2rem; line-height: 1; }
    .bubble {
      position: relative;
      font-family: var(--font-round);
      font-size: 1.05rem;
      text-align: left;
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 14px;
      padding: 6px 12px;
      animation: pop .35s ease-out .15s backwards;
    }
    .bubble::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 50%;
      margin-top: -7px;
      border: 7px solid transparent;
      border-right: 10px solid var(--line);
      border-left: 0;
    }

    /* 🔥 연승 배너 */
    .banner {
      position: absolute;
      left: 50%;
      top: 44%;
      z-index: 3;
      pointer-events: none;
      font-family: var(--font-pixel);
      text-align: center;
      white-space: nowrap;
      background: var(--ink);
      border: 4px solid var(--yellow);
      border-radius: 18px;
      box-shadow: 0 0 0 4px var(--line), 0 0 40px rgba(255, 120, 40, .7);
      padding: 12px 24px 10px;
      transform: translate(-50%, -50%) rotate(-4deg);
      animation: banner 1.3s ease-out forwards;
    }
    .banner .big {
      display: block;
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      color: #ffb238;
      text-shadow: 3px 3px 0 #ff4d2e;
    }
    .banner .small { display: block; color: #fff; font-size: 1rem; margin-top: 4px; }
    @keyframes banner {
      0%   { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
      15%  { transform: translate(-50%, -50%) scale(1.2) rotate(-4deg); opacity: 1; }
      25%  { transform: translate(-50%, -50%) scale(1) rotate(-4deg); }
      80%  { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
      100% { transform: translate(-50%, -80%) scale(.9) rotate(-4deg); opacity: 0; }
    }

    /* 🔊 소리 켜기/끄기 */
    .mute {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      font-size: 1.1rem;
      line-height: 1;
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 4px 0 var(--line);
      cursor: pointer;
      z-index: 2;
      transition: transform .08s, box-shadow .08s;
    }
    .mute:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
    .mute[aria-pressed="true"] { background: #eee8f7; }
    .mute:focus-visible { outline: 4px dashed var(--sky); outline-offset: 3px; }

    @media (max-width: 420px) {
      .cabinet { padding: 22px 14px 26px; border-radius: 22px; }
      .lights { gap: 8px; }
      .status-row { gap: 6px; }
      .streak, .speed-toggle { font-size: .8rem; padding: 4px 9px; gap: 5px; }
      .streak small, .speed-toggle .state { font-size: .68rem; }
      .mute { top: 10px; right: 10px; width: 34px; height: 34px; font-size: 1rem; }
      .choices { gap: 10px; }
      .choice { border-radius: 18px; padding: 14px 4px 12px; }
      .choice .label { padding: 2px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <button class="mute" type="button" id="mute" aria-pressed="false" aria-label="효과음 끄기">🔊</button>
    <div class="lights" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <h1>가위바위보!</h1>

    <div class="scoreboard" role="status" aria-label="점수">
      <span class="side">나</span>
      <span class="num me" id="score-me">0</span>
      <span class="colon">:</span>
      <span class="num cpu" id="score-cpu">0</span>
      <span class="side">컴퓨터</span>
    </div>
    <p class="goal">★ 먼저 3점 내면 최종 승리 ★</p>

    <div class="status-row">
      <div class="streak" id="streak">
        <span id="streak-text">0연승</span>
        <small>최고 <b id="best">0</b></small>
      </div>
      <button class="speed-toggle" type="button" id="speed" role="switch" aria-checked="false">
        ⏱️ 스피드 모드 <span class="state">OFF</span>
      </button>
    </div>

    <p class="subtitle">▶ 하나를 골라 주세요 ◀</p>
    <div class="timer" id="timer" aria-hidden="true">
      <span class="timer-num" id="timer-num">준비</span>
      <div class="timer-track"><div class="timer-bar" id="timer-bar"></div></div>
    </div>

    <section class="choices" aria-label="가위바위보 선택">
      <button class="choice scissors" type="button" data-choice="scissors">
        <span class="emoji" aria-hidden="true">✌️</span>
        <span class="label">가위</span>
      </button>
      <button class="choice rock" type="button" data-choice="rock">
        <span class="emoji" aria-hidden="true">✊</span>
        <span class="label">바위</span>
      </button>
      <button class="choice paper" type="button" data-choice="paper">
        <span class="emoji" aria-hidden="true">✋</span>
        <span class="label">보</span>
      </button>
    </section>

    <!-- 결과 표시 영역 -->
    <div class="result" id="result" aria-live="polite"></div>

    <!-- 최종 승리 / 패배 화면 -->
    <div class="final" id="final" role="dialog" aria-modal="true" aria-labelledby="final-title" hidden>
      <span class="sparkle" aria-hidden="true">✨</span>
      <span class="sparkle" aria-hidden="true">⭐</span>
      <span class="sparkle" aria-hidden="true">✨</span>
      <span class="sparkle" aria-hidden="true">⭐</span>
      <span class="champ">★ CHAMPION ★</span>
      <div class="big-emoji" id="final-emoji" aria-hidden="true"></div>
      <h2 id="final-title"></h2>
      <p class="final-score" id="final-score"></p>
      <button class="again" type="button" id="again">다시 하기 ↺</button>
    </div>
  </main>

  <script>
    const HANDS = {
      scissors: { emoji: '✌️', name: '가위', beats: 'paper' },
      rock:     { emoji: '✊', name: '바위', beats: 'scissors' },
      paper:    { emoji: '✋', name: '보',   beats: 'rock' },
    };
    const VERDICTS = {
      win:  '이겼다! 🎉',
      lose: '졌다… 😭',
      draw: '비겼다 🤝',
    };
    // ───── 🔊 효과음 (Web Audio로 직접 만드는 8비트 소리, 파일 없음) ─────
    const muteBtn = document.getElementById('mute');
    let muted = false;
    try { muted = localStorage.getItem('rps-muted') === '1'; } catch (e) {}
    let actx = null;

    function ctx() {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    // 삑! 음 하나 (freq Hz, at초 뒤에, dur초 동안)
    function tone(freq, at = 0, dur = .1, { type = 'square', vol = .1, slide } = {}) {
      const c = muted ? null : ctx();
      if (!c) return;
      const t = c.currentTime + at;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + .01);
      gain.gain.setValueAtTime(vol, t + dur * .6);
      gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t);
      osc.stop(t + dur + .02);
    }

    // 펑! (짧은 잡음)
    function noise(at = 0, dur = .25, vol = .18) {
      const c = muted ? null : ctx();
      if (!c) return;
      const t = c.currentTime + at;
      const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length) ** 2;
      const src = c.createBufferSource();
      const filter = c.createBiquadFilter();
      const gain = c.createGain();
      src.buffer = buf;
      filter.type = 'bandpass';
      filter.frequency.value = 1800;
      gain.gain.value = vol;
      src.connect(filter).connect(gain).connect(c.destination);
      src.start(t);
    }

    const N = { C4: 262, E4: 330, F4: 349, G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, G5: 784, A5: 880, B5: 988, C6: 1047, E6: 1319 };

    const sfx = {
      click() { tone(N.A5, 0, .05, { vol: .06 }); },
      win() {
        [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => tone(f, i * .07, .1));
        tone(N.E6, .28, .22, { type: 'triangle', vol: .12 });
      },
      lose() {
        tone(N.G4, 0, .18, { type: 'sawtooth', vol: .07 });
        tone(N.E4, .17, .45, { type: 'sawtooth', vol: .07, slide: 110 });
      },
      draw() {
        tone(N.A4, 0, .09, { type: 'triangle', vol: .14 });
        tone(N.A4, .14, .09, { type: 'triangle', vol: .14 });
      },
      pop(at = 0) { noise(at, .22, .16); tone(N.C6, at, .06, { type: 'triangle', vol: .05, slide: N.C5 }); },
      champion() {
        // 빠-빠-빠-빠아~ 빠라밤!
        [N.G4, N.C5, N.E5, N.G5].forEach((f, i) => tone(f, i * .13, .12));
        tone(N.E5, .55, .14);
        tone(N.G5, .72, .7, { vol: .11 });
        tone(N.C6, .72, .7, { type: 'triangle', vol: .1 });
        [N.C5, N.E5, N.G5, N.C6, N.E6].forEach((f, i) => tone(f, 1.5 + i * .06, .14, { vol: .07 }));
      },
      gameOver() {
        // 뿌-뿌-뿌-뿌우우~
        [N.G4, 370, N.F4].forEach((f, i) => tone(f, i * .32, .26, { type: 'triangle', vol: .16 }));
        tone(N.E4, .96, .9, { type: 'triangle', vol: .16, slide: 200 });
      },
      coin() { tone(N.B5, 0, .08, { vol: .08 }); tone(N.E6, .08, .3, { vol: .08 }); },
      tick(sec) { tone(sec === 1 ? N.E6 : N.A5, 0, .06, { type: 'triangle', vol: .14 }); },
      buzz() { tone(150, 0, .45, { type: 'sawtooth', vol: .08 }); tone(155, 0, .45, { type: 'square', vol: .05 }); },
      fire() {
        tone(220, 0, .35, { type: 'sawtooth', vol: .05, slide: 880 });
        noise(.05, .35, .12);
        [N.E5, N.G5, N.B5, N.E6].forEach((f, i) => tone(f, .3 + i * .06, .12, { vol: .07 }));
      },
    };

    function setMuted(m) {
      muted = m;
      muteBtn.textContent = m ? '🔇' : '🔊';
      muteBtn.setAttribute('aria-pressed', String(m));
      muteBtn.setAttribute('aria-label', m ? '효과음 켜기' : '효과음 끄기');
      try { localStorage.setItem('rps-muted', m ? '1' : '0'); } catch (e) {}
    }
    setMuted(muted);
    muteBtn.addEventListener('click', () => {
      setMuted(!muted);
      if (!muted) sfx.click();
    });

    const WIN_SCORE = 3;
    const result = document.getElementById('result');
    const scoreMeEl = document.getElementById('score-me');
    const scoreCpuEl = document.getElementById('score-cpu');
    const finalEl = document.getElementById('final');
    const againBtn = document.getElementById('again');
    const choiceBtns = document.querySelectorAll('.choice');
    const cabinet = document.querySelector('.cabinet');
    let score = { me: 0, cpu: 0 };

    function bump(el, value) {
      el.textContent = value;
      el.classList.remove('bump');
      void el.offsetWidth; // 애니메이션 다시 시작
      el.classList.add('bump');
    }

    function showFinal() {
      const won = score.me >= WIN_SCORE;
      finalEl.className = 'final ' + (won ? 'win' : 'lose');
      document.getElementById('final-emoji').textContent = won ? '🏆' : '😵';
      document.getElementById('final-title').textContent = won ? '최종 승리!' : '최종 패배…';
      document.getElementById('final-score').textContent =
        `나 ${score.me} : ${score.cpu} 컴퓨터` + (won ? ' 🎉' : ' 다음엔 이길 거야!');
      finalEl.hidden = false;
      choiceBtns.forEach(b => b.disabled = true);
      if (won) { celebrate(); sfx.champion(); }
      else { replay(cabinet, 'shake'); sfx.gameOver(); }
      againBtn.focus();
    }

    // ───── 효과 ─────
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const fxLayer = document.createElement('div');
    fxLayer.className = 'fx';
    fxLayer.setAttribute('aria-hidden', 'true');
    document.body.appendChild(fxLayer);
    const COLORS = ['--pink', '--yellow', '--mint', '--sky', '--lilac'];
    let celebrateTimers = [];

    // 클래스를 뺐다 다시 넣어서 애니메이션을 처음부터 재생
    function replay(el, cls) {
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
      const done = e => {
        if (e.target !== el || e.pseudoElement) return; // 자식 애니메이션은 무시
        el.classList.remove(cls);
        el.removeEventListener('animationend', done);
      };
      el.addEventListener('animationend', done);
    }

    // (x, y) 지점에서 색종이 펑! angle 방향으로 spread 만큼 퍼짐
    function burst(x, y, count, angle = -90, spread = 360, power = 1) {
      sfx.pop();
      if (reduceMotion.matches) return;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('span');
        const shape = Math.random();
        p.className = 'piece' + (shape < .2 ? ' star' : shape < .45 ? ' round' : '');
        const a = (angle + (Math.random() - .5) * spread) * Math.PI / 180;
        const dist = (90 + Math.random() * 200) * power;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--c', `var(${COLORS[i % COLORS.length]})`);
        p.style.setProperty('--size', (7 + Math.random() * 7) + 'px');
        p.style.setProperty('--dx', Math.cos(a) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(a) * dist + 'px');
        p.style.setProperty('--rot', (Math.random() * 1440 - 720) + 'deg');
        p.style.setProperty('--dur', (1.3 + Math.random() * 1.1) + 's');
        p.addEventListener('animationend', () => p.remove());
        fxLayer.appendChild(p);
      }
    }

    function burstFrom(el, count, power) {
      const r = el.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, count, -90, 360, power);
    }

    // 최종 승리: 양옆 대포 + 가운데 연속 폭죽
    function celebrate() {
      const w = innerWidth, h = innerHeight;
      const shots = [
        [0,    () => burst(0, h, 60, -60, 40, 2.4)],
        [0,    () => burst(w, h, 60, -120, 40, 2.4)],
        [500,  () => burst(w * .5, h * .35, 50, -90, 360, 1.3)],
        [1000, () => burst(w * .25, h * .3, 40, -90, 360, 1.1)],
        [1300, () => burst(w * .75, h * .3, 40, -90, 360, 1.1)],
        [1900, () => burst(0, h, 45, -60, 40, 2.2)],
        [1900, () => burst(w, h, 45, -120, 40, 2.2)],
      ];
      celebrateTimers = shots.map(([t, fn]) => setTimeout(fn, t));
    }

    // ───── 🔥 연승 카운트 ─────
    const streakEl = document.getElementById('streak');
    const streakText = document.getElementById('streak-text');
    const bestEl = document.getElementById('best');
    let streak = 0;
    let best = 0;
    try { best = parseInt(localStorage.getItem('rps-best-streak'), 10) || 0; } catch (e) {}
    bestEl.textContent = best;

    const FIRE_TIERS = [
      [10, '👑 가위바위보의 신!'],
      [7,  '☄️ 전설의 손!'],
      [5,  '🔥🔥 멈출 수 없다!'],
      [3,  '🔥 불붙었다!'],
    ];

    function renderStreak() {
      streakText.textContent = streak >= 3 ? `🔥 ${streak}연승!` : `${streak}연승`;
      streakEl.classList.toggle('hot', streak >= 3);
      bestEl.textContent = best;
    }

    function showBanner(big, small) {
      const b = document.createElement('div');
      b.className = 'banner';
      b.setAttribute('aria-hidden', 'true');
      b.innerHTML = `<span class="big">${big}</span><span class="small">${small}</span>`;
      cabinet.appendChild(b);
      setTimeout(() => b.remove(), 1300);
    }

    function addWinToStreak() {
      streak++;
      if (streak > best) {
        best = streak;
        try { localStorage.setItem('rps-best-streak', String(best)); } catch (e) {}
      }
      renderStreak();
      replay(streakEl, 'bump');
      const tier = FIRE_TIERS.find(([n]) => streak >= n);
      if (tier) {
        showBanner(tier[1], `${streak}연승 중!`);
        setTimeout(sfx.fire, 250);
      }
    }

    // ───── 🤖 수다쟁이 컴퓨터 ─────
    const LINES = {
      cpuWin: [
        '메롱~ 내가 이겼지롱 😜',
        '역시 나는 천재 컴퓨터야!',
        '그것밖에 안 돼? 히히',
        '내 계산은 틀리지 않아 🤓',
        '삐빅! 승리 확인 완료!',
        '너무 쉬운데~?',
        '내 마음을 읽기엔 아직 멀었어!',
      ],
      cpuLose: [
        '으악! 반칙 아니야?! 😤',
        '방금 건 연습이었어!',
        '내 회로가 꼬였나…',
        '다음엔 절대 안 져!',
        '끄응… 운이 좋았을 뿐이야',
        '삐-빅… 오류 발생… 분하다!',
        '한 번만 봐준 거야!',
      ],
      draw: [
        '흥, 따라 하지 마!',
        '오~ 통했다?',
        '똑같은 생각이었네!',
        '다시! 다시!',
      ],
      timeout: [
        '너무 느려~ 잠든 거야? 😴',
        '시간 끝! 땡~ ⏰',
        '째깍째깍… 시간은 기다려 주지 않아!',
        '손이 얼었어? 히히',
      ],
      streakBroken: [
        '드디어 불 껐다! 🧯',
        '연승 끝~ 내가 끊었지롱!',
        '불장난은 여기까지야! 💦',
      ],
    };
    let lastLine = '';

    function pickLine(kind) {
      const pool = LINES[kind].filter(l => l !== lastLine);
      lastLine = pool[Math.floor(Math.random() * pool.length)];
      return lastLine;
    }

    // ───── ⏱️ 스피드 모드 ─────
    const SPEED_SECONDS = 3;
    const speedBtn = document.getElementById('speed');
    const timerEl = document.getElementById('timer');
    const timerNum = document.getElementById('timer-num');
    const timerBar = document.getElementById('timer-bar');
    let speedOn = false;
    let gameOver = false;
    let cdRaf = 0, cdNext = 0, cdDeadline = 0, cdLastSec = 0;

    function stopCountdown() {
      cancelAnimationFrame(cdRaf);
      clearTimeout(cdNext);
      cdRaf = 0;
      timerEl.classList.remove('hurry');
    }

    // delay 뒤에 3초 카운트다운 시작 (그 사이엔 "준비")
    function queueCountdown(delay) {
      stopCountdown();
      if (!speedOn || gameOver) return;
      timerNum.textContent = '준비';
      timerBar.style.transform = 'scaleX(1)';
      cdNext = setTimeout(startCountdown, delay);
    }

    function startCountdown() {
      stopCountdown();
      if (!speedOn || gameOver) return;
      cdDeadline = performance.now() + SPEED_SECONDS * 1000;
      cdLastSec = 0;
      tickCountdown();
    }

    function tickCountdown() {
      const left = cdDeadline - performance.now();
      if (left <= 0) {
        stopCountdown();
        timerNum.textContent = '0';
        timerBar.style.transform = 'scaleX(0)';
        playRound(null); // 시간 초과 = 자동 패배
        return;
      }
      const sec = Math.ceil(left / 1000);
      if (sec !== cdLastSec) {
        cdLastSec = sec;
        timerNum.textContent = sec;
        replay(timerNum, 'bump');
        timerEl.classList.toggle('hurry', sec === 1);
        sfx.tick(sec);
      }
      timerBar.style.transform = `scaleX(${left / (SPEED_SECONDS * 1000)})`;
      cdRaf = requestAnimationFrame(tickCountdown);
    }

    function setSpeed(on) {
      speedOn = on;
      speedBtn.setAttribute('aria-checked', String(on));
      speedBtn.querySelector('.state').textContent = on ? 'ON' : 'OFF';
      cabinet.classList.toggle('speed', on);
      if (on) queueCountdown(900);
      else stopCountdown();
    }
    speedBtn.addEventListener('click', () => { sfx.click(); setSpeed(!speedOn); });

    // 다른 탭에 갔다 오면 억울하게 지지 않도록 다시 준비부터
    document.addEventListener('visibilitychange', () => {
      if (!speedOn || gameOver) return;
      if (document.hidden) stopCountdown();
      else queueCountdown(900);
    });

    // ───── 게임 진행 ─────
    function resetGame() {
      score = { me: 0, cpu: 0 };
      gameOver = false;
      scoreMeEl.textContent = 0;
      scoreCpuEl.textContent = 0;
      result.innerHTML = '';
      finalEl.hidden = true;
      celebrateTimers.forEach(clearTimeout);
      fxLayer.replaceChildren();
      choiceBtns.forEach(b => b.disabled = false);
      choiceBtns[0].focus();
      sfx.coin();
      queueCountdown(1000);
    }
    againBtn.addEventListener('click', resetGame);

    function judge(me, cpu) {
      if (me === null) return 'lose'; // 시간 초과
      if (me === cpu) return 'draw';
      return HANDS[me].beats === cpu ? 'win' : 'lose';
    }

    // me: 'scissors' | 'rock' | 'paper' | null(시간 초과)
    function playRound(me) {
      stopCountdown();
      const keys = Object.keys(HANDS);
      const cpu = keys[Math.floor(Math.random() * keys.length)];
      const outcome = judge(me, cpu);
      const timedOut = me === null;
      const myHand = timedOut ? { emoji: '⏰', name: '시간 초과' } : HANDS[me];
      const verdict = timedOut ? '시간 초과! 졌다… ⏰' : VERDICTS[outcome];

      let line;
      if (timedOut) line = pickLine('timeout');
      else if (outcome === 'lose' && streak >= 3) line = pickLine('streakBroken');
      else line = pickLine(outcome === 'win' ? 'cpuLose' : outcome === 'lose' ? 'cpuWin' : 'draw');

      result.innerHTML = `
        <div class="faceoff">
          <div class="hand me">
            <span class="who">나</span>
            <span class="big" aria-hidden="true">${myHand.emoji}</span>
            <span class="who">${myHand.name}</span>
          </div>
          <span class="vs">VS</span>
          <div class="hand cpu">
            <span class="who">컴퓨터</span>
            <span class="big" aria-hidden="true">${HANDS[cpu].emoji}</span>
            <span class="who">${HANDS[cpu].name}</span>
          </div>
        </div>
        <div class="verdict ${outcome}">${verdict}</div>
        <div class="talk">
          <span class="bot" aria-hidden="true">🤖</span>
          <span class="bubble">${line}</span>
        </div>
      `;

      if (timedOut) sfx.buzz();
      else sfx.click();
      sfx[outcome]();

      if (outcome === 'win') {
        bump(scoreMeEl, ++score.me);
        burstFrom(result.querySelector('.verdict'), 36, 1);
        burstFrom(scoreMeEl, 14, .5);
        replay(cabinet, 'flash-win');
        addWinToStreak();
      }
      if (outcome === 'lose') {
        bump(scoreCpuEl, ++score.cpu);
        replay(cabinet, 'shake');
        streak = 0;
        renderStreak();
      }

      if (score.me >= WIN_SCORE || score.cpu >= WIN_SCORE) {
        // 마지막 판 결과를 잠깐 보여준 뒤 최종 화면
        gameOver = true;
        choiceBtns.forEach(b => b.disabled = true);
        setTimeout(showFinal, 900);
      } else {
        queueCountdown(1600); // 결과를 읽을 시간 주고 다음 카운트다운
      }
    }

    choiceBtns.forEach(btn => {
      btn.addEventListener('click', () => playRound(btn.dataset.choice));
    });
  </script>
</body>
</html>
