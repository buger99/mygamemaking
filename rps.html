<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>가위바위보!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    /* 픽셀 글씨체 (오락실 느낌) */
    @font-face {
      font-family: 'Galmuri11';
      src: url('fonts/Galmuri11.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      /* 밝은 사탕 오락실 팔레트 */
      --bg-top: #fff4d6;
      --bg-bottom: #ffd9e8;
      --cabinet: #ffffff;
      --ink: #3b2a55;
      --line: #3b2a55;
      --pink: #ff6fa5;
      --yellow: #ffd23f;
      --mint: #3ddbb0;
      --sky: #5ab8ff;
      --lilac: #b28dff;

      --font-pixel: 'Galmuri11', 'Jua', monospace;
      --font-round: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font-round);
      color: var(--ink);
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.7) 2px, transparent 2.5px) 0 0 / 28px 28px,
        linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      word-break: keep-all;
    }

    /* ───────── 🕹️ 오락실 기계 ───────── */
    .cabinet {
      width: 100%;
      max-width: 620px;
      background: var(--cabinet);
      border: 4px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 10px 0 var(--line), 0 18px 30px rgba(59, 42, 85, 0.18);
      padding: 28px 24px 32px;
      text-align: center;
      position: relative;
    }

    /* 기계 위쪽 반짝이 전구 줄 */
    .lights {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .lights span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--line);
      animation: blink 1.2s steps(1) infinite;
    }
    .lights span:nth-child(5n+1) { background: var(--pink); }
    .lights span:nth-child(5n+2) { background: var(--yellow); animation-delay: .2s; }
    .lights span:nth-child(5n+3) { background: var(--mint);   animation-delay: .4s; }
    .lights span:nth-child(5n+4) { background: var(--sky);    animation-delay: .6s; }
    .lights span:nth-child(5n+5) { background: var(--lilac);  animation-delay: .8s; }
    @keyframes blink { 50% { opacity: .3; } }

    /* ───────── 제목 ───────── */
    h1 {
      font-family: var(--font-pixel);
      font-size: clamp(2.2rem, 9vw, 3.6rem);
      line-height: 1.1;
      letter-spacing: 2px;
      color: var(--yellow);
      -webkit-text-stroke: 2px var(--line);
      paint-order: stroke fill;
      text-shadow: 4px 4px 0 var(--pink), 7px 7px 0 var(--line);
      margin-bottom: 8px;
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(-4px); } }

    .subtitle {
      font-family: var(--font-pixel);
      font-size: .95rem;
      color: var(--lilac);
      margin-bottom: 28px;
    }

    /* ───────── ✌️✊✋ 큰 버튼 3개 ───────── */
    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .choice {
      --c: var(--pink);
      font: inherit;
      color: var(--ink);
      background: var(--c);
      border: 4px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 8px 0 var(--line);
      padding: 18px 6px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform .08s, box-shadow .08s, filter .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice.scissors { --c: var(--pink); }
    .choice.rock     { --c: var(--yellow); }
    .choice.paper    { --c: var(--mint); }

    .choice .emoji {
      font-size: clamp(2.8rem, 13vw, 4.4rem);
      line-height: 1;
      filter: drop-shadow(0 3px 0 rgba(59, 42, 85, .25));
    }
    .choice .label {
      font-family: var(--font-pixel);
      font-size: clamp(1rem, 4vw, 1.3rem);
      background: #fff;
      border: 3px solid var(--line);
      border-radius: 999px;
      padding: 2px 14px;
    }

    .choice:hover { filter: brightness(1.06); transform: translateY(-3px); box-shadow: 0 11px 0 var(--line); }
    .choice:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--line); }
    .choice:focus-visible { outline: 4px dashed var(--sky); outline-offset: 5px; }

    /* ───────── 결과 표시 영역 (아직 비어 있음) ───────── */
    .result {
      min-height: 140px;
      border: 4px dashed var(--line);
      border-radius: 20px;
      background:
        repeating-linear-gradient(0deg, rgba(90, 184, 255, .08) 0 2px, transparent 2px 6px),
        #f2f8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: var(--font-pixel);
      font-size: 1.1rem;
    }
    .result:empty::before {
      content: '버튼을 눌러 보세요!';
      color: rgba(59, 42, 85, .4);
      animation: blink 1.4s steps(1) infinite;
    }

    @media (max-width: 420px) {
      .cabinet { padding: 22px 14px 26px; border-radius: 22px; }
      .choices { gap: 10px; }
      .choice { border-radius: 18px; padding: 14px 4px 12px; }
      .choice .label { padding: 2px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <div class="lights" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <h1>가위바위보!</h1>
    <p class="subtitle">▶ 하나를 골라 주세요 ◀</p>

    <section class="choices" aria-label="가위바위보 선택">
      <button class="choice scissors" type="button" data-choice="scissors">
        <span class="emoji" aria-hidden="true">✌️</span>
        <span class="label">가위</span>
      </button>
      <button class="choice rock" type="button" data-choice="rock">
        <span class="emoji" aria-hidden="true">✊</span>
        <span class="label">바위</span>
      </button>
      <button class="choice paper" type="button" data-choice="paper">
        <span class="emoji" aria-hidden="true">✋</span>
        <span class="label">보</span>
      </button>
    </section>

    <!-- 결과가 여기에 표시될 예정 (게임 규칙은 아직 없음) -->
    <div class="result" id="result" aria-live="polite"></div>
  </main>
</body>
</html>
