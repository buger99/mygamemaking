<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>정한별 RPG</title>
  <style>
    /* 레이아웃: 고전 RPG 전투 화면 — 캐릭터 무대, 흰 테두리 대화창, 상태줄, 메뉴 버튼 4개가 위에서 아래로 */
    @font-face {
      font-family: 'Galmuri11';
      src: url('fonts/Galmuri11.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --fg: #ffffff;
      --dim: #a8a8a8;
      --menu: #ff9020;
      --pick: #ffff40;
      --soul: #ff1a1a;
      --hp: #ffff00;
      --hp-lost: #c21010;
      --font-pixel: 'Galmuri11', 'Courier New', monospace;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    [hidden] { display: none !important; }

    html { scrollbar-color: var(--fg) var(--bg); }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-pixel);
      min-height: 100vh;
      word-break: keep-all;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    ::selection { background: var(--pick); color: var(--bg); }

    .screen {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 맨 위 작은 줄: 소리 켜기 */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      color: var(--dim);
    }

    .sound {
      font: inherit;
      color: var(--dim);
      background: none;
      border: 2px solid var(--dim);
      padding: 4px 10px;
      cursor: pointer;
    }

    .sound[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }

    /* 캐릭터가 서 있는 무대 */
    .stage {
      height: 290px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }

    #sprite {
      width: 240px;
      height: 240px;
      image-rendering: pixelated;
      animation: idle 1.2s steps(1) infinite;
    }

    @keyframes idle {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    #sprite.hurt { animation: shake 0.3s steps(2) 2; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(6px); }
    }

    /* 흰 테두리 대화창 / 전투 상자 */
    .box {
      position: relative;
      border: 4px solid var(--fg);
      background: var(--bg);
      min-height: 170px;
      padding: 18px 22px;
    }

    .dialog-text {
      font-size: 1.6rem;
      line-height: 1.7;
      white-space: pre-wrap;
      min-height: 4.6em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .next {
      position: absolute;
      right: 14px;
      bottom: 8px;
      color: var(--fg);
      animation: blink 0.8s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* 취미 고르기 같은 작은 선택지 */
    .choices {
      display: grid;
      align-content: start;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 24px;
      margin-top: 6px;
    }

    .choice {
      font: inherit;
      font-size: 1.6rem;
      text-align: left;
      color: var(--fg);
      background: none;
      border: none;
      padding: 6px 0 6px 30px;
      position: relative;
      cursor: pointer;
    }

    .choice::before {
      content: '*';
      position: absolute;
      left: 8px;
    }

    .choice.on { color: var(--pick); }
    .choice.on::before { content: ''; left: 2px; top: 50%; width: 16px; height: 16px; margin-top: -8px; background: var(--soul); clip-path: var(--heart-shape); }

    /* 미니 게임 */
    .battle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #arena {
      width: min(100%, 300px);
      aspect-ratio: 1;
      max-width: 100%;
      border: 4px solid var(--fg);
      image-rendering: pixelated;
      touch-action: none;
      cursor: grab;
    }

    .battle-info {
      display: flex;
      justify-content: space-between;
      width: min(100%, 300px);
      font-size: 1.1rem;
      color: var(--dim);
    }

    .quit {
      font: inherit;
      font-size: 1.15rem;
      color: var(--dim);
      background: none;
      border: 2px solid var(--dim);
      padding: 6px 14px;
      cursor: pointer;
    }

    /* 이름과 체력 */
    .status {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 22px;
      font-size: 1.35rem;
    }

    .hp { display: flex; align-items: center; gap: 10px; }
    .hp-label { font-size: 1rem; }

    .hp-bar {
      width: 90px;
      height: 22px;
      background: var(--hp-lost);
    }

    .hp-fill {
      height: 100%;
      background: var(--hp);
      transition: width 0.2s steps(4);
    }

    /* 메뉴 버튼 4개 */
    .menu {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .menu-btn {
      font: inherit;
      font-size: 1.35rem;
      color: var(--menu);
      background: var(--bg);
      border: 3px solid var(--menu);
      padding: 12px 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 60px;
    }

    .menu-btn .mark { width: 16px; text-align: center; }

    .menu-btn.on {
      color: var(--pick);
      border-color: var(--pick);
    }

    .menu-btn.on .mark {
      color: transparent;
      background: var(--soul);
      height: 16px;
      clip-path: var(--heart-shape);
    }

    .menu-btn:disabled { opacity: 0.35; cursor: default; }

    :root {
      /* 도트 하트 모양 (16×16 칸) */
      --heart-shape: polygon(12.5% 6.25%, 37.5% 6.25%, 50% 18.75%, 62.5% 6.25%, 87.5% 6.25%, 100% 18.75%, 100% 43.75%, 87.5% 56.25%, 75% 68.75%, 62.5% 81.25%, 50% 93.75%, 37.5% 81.25%, 25% 68.75%, 12.5% 56.25%, 0 43.75%, 0 18.75%);
    }

    .keys {
      font-size: 1rem;
      color: var(--dim);
      text-align: center;
      line-height: 1.7;
    }

    button:focus-visible {
      outline: 3px dashed var(--pick);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    @media (max-width: 520px) {
      .stage { height: 230px; }
      #sprite { width: 192px; height: 192px; }
      .box { padding: 14px 16px; min-height: 140px; }
      .dialog-text, .choice { font-size: 1.35rem; }
      .status { font-size: 1.2rem; }
      .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .menu-btn { font-size: 1.25rem; min-height: 60px; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="topbar">
      <span>정한별 RPG</span>
      <button class="sound" id="soundBtn" type="button" aria-pressed="false">♪ 소리 끔</button>
    </div>

    <div class="stage">
      <canvas id="sprite" width="16" height="16" role="img" aria-label="별 모양 도트 캐릭터, 정한별"></canvas>
    </div>

    <!-- 대화창 -->
    <section class="box" id="dialogBox">
      <p class="sr-only" id="srText" aria-live="polite"></p>
      <p class="dialog-text" id="dialogText" aria-hidden="true"></p>
      <div class="choices" id="choices" hidden></div>
      <span class="next" id="nextMark" aria-hidden="true" hidden>▼</span>
    </section>

    <!-- 미니 게임 -->
    <section class="battle" id="battle" hidden aria-label="미니 게임: 별 피하기">
      <canvas id="arena" width="150" height="150" aria-label="전투 상자. 방향키나 손가락으로 하트를 움직여 떨어지는 것들을 피하세요."></canvas>
      <div class="battle-info">
        <span id="timeLeft">남은 시간 15</span>
        <span>방향키 · 드래그로 이동</span>
      </div>
      <button class="quit" id="quitBtn" type="button">그만하기</button>
    </section>

    <div class="status">
      <span>한별</span>
      <span>LV 1</span>
      <span class="hp">
        <span class="hp-label">HP</span>
        <span class="hp-bar" aria-hidden="true"><span class="hp-fill" id="hpFill" style="width:100%; display:block"></span></span>
        <span id="hpText">20 / 20</span>
      </span>
    </div>

    <nav class="menu" id="menu" aria-label="메뉴">
      <button class="menu-btn" type="button" data-act="check"><span class="mark" aria-hidden="true">★</span>살펴보기</button>
      <button class="menu-btn" type="button" data-act="hobby"><span class="mark" aria-hidden="true">♥</span>취미</button>
      <button class="menu-btn" type="button" data-act="fight"><span class="mark" aria-hidden="true">⚔</span>대결</button>
      <button class="menu-btn" type="button" data-act="hello"><span class="mark" aria-hidden="true">♡</span>인사</button>
    </nav>

    <p class="keys">← → 메뉴 고르기 · Z / Enter 결정 · X 넘기기·취소</p>
  </main>

  <script>
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ───────── 🔊 소리 (버튼을 눌러야 켜져요) ─────────
    let audio = null;
    let soundOn = false;
    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      if (soundOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      soundBtn.setAttribute('aria-pressed', String(soundOn));
      soundBtn.textContent = soundOn ? '♪ 소리 켬' : '♪ 소리 끔';
      if (soundOn) beep(660, 0.06);
    });

    function beep(freq, len, type = 'square', vol = 0.05) {
      if (!soundOn || !audio) return;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = vol;
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + len);
      osc.connect(gain).connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + len);
    }

    // ───────── ⭐ 별 캐릭터 그리기 ─────────
    const SPRITE = [
      '.......YY.......',
      '......YYYY......',
      '......YYYY......',
      '.....YYYYYY.....',
      'YYYYYYYYYYYYYYYY',
      '.YYYYYYYYYYYYYY.',
      '..YYYKKYYYYKKY..',
      '..YYYKWYYYYKWY..',
      '..YYYKKYYYYKKY..',
      '..YPPYYYYYYYPPY.',
      '..YPPYYKKKKYPPY.',
      '..YYYYYY..YYYYY.',
      '.YYYY......YYYY.',
      '.YYY........YYY.',
      'YYY..........YYY',
      'YY............YY'
    ];
    // 눈 감은 모습
    const BLINK = SPRITE.map((row, y) => {
      if (y === 6 || y === 8) return row.replace(/[KW]/g, 'Y');
      if (y === 7) return '..YYYKKYYYYKKY..';
      return row;
    });
    const PALETTE = { Y: '#ffe23d', W: '#ffffff', K: '#2b1d0e', P: '#ff9fb0' };
    const spriteCtx = document.getElementById('sprite').getContext('2d');

    function drawSprite(map) {
      spriteCtx.clearRect(0, 0, 16, 16);
      map.forEach((row, y) => [...row].forEach((c, x) => {
        if (PALETTE[c]) { spriteCtx.fillStyle = PALETTE[c]; spriteCtx.fillRect(x, y, 1, 1); }
      }));
    }
    drawSprite(SPRITE);
    if (!reduceMotion) {
      setInterval(() => { drawSprite(BLINK); setTimeout(() => drawSprite(SPRITE), 160); }, 3200);
    }

    // ───────── 💬 대화창 (한 글자씩) ─────────
    const dialogText = document.getElementById('dialogText');
    const srText = document.getElementById('srText');
    const nextMark = document.getElementById('nextMark');
    const choicesEl = document.getElementById('choices');
    let typing = null;
    let pages = [];
    let onDone = null;

    function say(lines, done) {
      pages = Array.isArray(lines) ? [...lines] : [lines];
      onDone = done || null;
      showPage(pages.shift());
    }

    function showPage(text) {
      clearInterval(typing);
      dialogText.style.minHeight = '';
      choicesEl.hidden = true;
      nextMark.hidden = true;
      srText.textContent = text;
      if (reduceMotion) { dialogText.textContent = text; finishPage(); return; }
      dialogText.textContent = '';
      let i = 0;
      typing = setInterval(() => {
        const ch = text[i++];
        dialogText.textContent += ch;
        if (ch.trim() && i % 2) beep(520 + Math.random() * 40, 0.03);
        if (i >= text.length) { clearInterval(typing); typing = null; finishPage(); }
      }, 45);
    }

    function finishPage() {
      if (pages.length) nextMark.hidden = false;
      else if (onDone) { const f = onDone; onDone = null; f(); }
    }

    // X 키나 대화창을 누르면: 글자를 바로 다 보여주거나 다음 장으로
    function advance() {
      if (typing) {
        clearInterval(typing);
        typing = null;
        dialogText.textContent = srText.textContent;
        finishPage();
      } else if (pages.length) {
        beep(780, 0.04);
        showPage(pages.shift());
      }
    }
    document.getElementById('dialogBox').addEventListener('click', (e) => {
      if (!e.target.closest('.choice')) advance();
    });

    // ───────── 📋 메뉴 ─────────
    const menuBtns = [...document.querySelectorAll('.menu-btn')];
    let menuIndex = 0;
    let mode = 'menu'; // menu | choice | battle

    function setMenu(i) {
      menuIndex = (i + menuBtns.length) % menuBtns.length;
      menuBtns.forEach((b, j) => b.classList.toggle('on', j === menuIndex));
    }
    setMenu(0);

    menuBtns.forEach((btn, i) => {
      btn.addEventListener('mouseenter', () => { if (mode === 'menu') setMenu(i); });
      btn.addEventListener('focus', () => setMenu(i));
      btn.addEventListener('click', () => { setMenu(i); act(btn.dataset.act); });
    });

    const TMI = [
      '* 쉬는 날엔 게임 한 판은 기본!',
      '* 영화 볼 때 팝콘은 필수예요.',
      '* 노래 들으면서 코딩하는 중~',
      '* 나의 꿈: 멋진 게임 만들기!'
    ];
    let checkCount = 0;

    const HOBBIES = {
      게임: ['* 게임.', '* 언더테일, 데드 바이 데이라이트,\n* 테라리아를 좋아해요!'],
      영화: ['* 영화.', '* 위대한 쇼맨, 오딧세이, 테넷.\n* 팝콘은 필수!'],
      노래: ['* 노래.', '* 음율, ZUTOMAYO, 장범준.\n* 듣는 것도 부르는 것도 좋아요.']
    };

    function act(name) {
      if (mode === 'battle') return;
      beep(880, 0.05);
      if (name === 'check') {
        if (checkCount === 0) {
          say(['* 정한별 - LV 1 새내기 개발자.', '* 게임 만들기에 도전 중이다!', '* (한 번 더 살펴보면 TMI가 나와요.)']);
        } else {
          say(TMI[(checkCount - 1) % TMI.length]);
        }
        checkCount++;
      } else if (name === 'hobby') {
        showChoices(Object.keys(HOBBIES), (key) => say(HOBBIES[key]));
      } else if (name === 'hello') {
        say(['* 반가워!', '* 정한별이 반갑게 손을 흔든다.', '* 정한별과 친구가 되었다!']);
      } else if (name === 'fight') {
        say('* 정한별이 별을 던지려 한다!', () => setTimeout(startBattle, 500));
      }
    }

    // 취미 고르기
    let choiceList = [];
    let choiceIndex = 0;
    let choicePick = null;

    function showChoices(list, pickFn) {
      clearInterval(typing);
      typing = null;
      pages = [];
      dialogText.textContent = '';
      dialogText.style.minHeight = '0';
      nextMark.hidden = true;
      srText.textContent = '어떤 취미를 볼까요? ' + list.join(', ');
      choicesEl.replaceChildren();
      choiceList = list.map((label, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'choice';
        b.textContent = label;
        b.addEventListener('mouseenter', () => setChoice(i));
        b.addEventListener('focus', () => setChoice(i));
        b.addEventListener('click', () => pickChoice(i));
        choicesEl.appendChild(b);
        return b;
      });
      choicePick = pickFn;
      choicesEl.hidden = false;
      mode = 'choice';
      setChoice(0);
      choiceList[0].focus();
    }

    function setChoice(i) {
      choiceIndex = (i + choiceList.length) % choiceList.length;
      choiceList.forEach((b, j) => b.classList.toggle('on', j === choiceIndex));
    }

    function pickChoice(i) {
      beep(880, 0.05);
      mode = 'menu';
      const label = choiceList[i].textContent;
      choicesEl.hidden = true;
      choicePick(label);
      menuBtns[menuIndex].focus();
    }

    function cancelChoice() {
      mode = 'menu';
      choicesEl.hidden = true;
      say('* 정한별이 기다리고 있다.');
      menuBtns[menuIndex].focus();
    }

    // ───────── ⌨️ 키보드 ─────────
    const held = {};
    document.addEventListener('keydown', (e) => {
      const k = e.key;
      if (mode === 'battle') {
        if (k.startsWith('Arrow') || 'wasdWASD'.includes(k)) { held[k.toLowerCase()] = true; e.preventDefault(); }
        if (k === 'Escape') endBattle('quit');
        return;
      }
      if (mode === 'choice') {
        if (k === 'ArrowLeft' || k === 'ArrowUp') { setChoice(choiceIndex - 1); choiceList[choiceIndex].focus(); e.preventDefault(); }
        if (k === 'ArrowRight' || k === 'ArrowDown') { setChoice(choiceIndex + 1); choiceList[choiceIndex].focus(); e.preventDefault(); }
        if (k === 'z' || k === 'Z') pickChoice(choiceIndex);
        if (k === 'x' || k === 'X' || k === 'Escape') cancelChoice();
        return;
      }
      if (k === 'ArrowLeft')  { setMenu(menuIndex - 1); menuBtns[menuIndex].focus(); e.preventDefault(); }
      if (k === 'ArrowRight') { setMenu(menuIndex + 1); menuBtns[menuIndex].focus(); e.preventDefault(); }
      if (k === 'z' || k === 'Z') act(menuBtns[menuIndex].dataset.act);
      if (k === 'x' || k === 'X') advance();
    });
    document.addEventListener('keyup', (e) => { held[e.key.toLowerCase()] = false; });

    // ───────── ⚔ 미니 게임: 별 피하기 ─────────
    const battleEl = document.getElementById('battle');
    const dialogBox = document.getElementById('dialogBox');
    const arena = document.getElementById('arena');
    const ctx = arena.getContext('2d');
    const SIZE = 150;
    const DURATION = 15;
    const MAX_HP = 20;
    const hpFill = document.getElementById('hpFill');
    const hpText = document.getElementById('hpText');
    const timeLeftEl = document.getElementById('timeLeft');
    const sprite = document.getElementById('sprite');

    const HEART = [
      '.XX.XX.',
      'XXXXXXX',
      'XXXXXXX',
      '.XXXXX.',
      '..XXX..',
      '...X...'
    ];
    const STAR = [
      '..Y..',
      '.YYY.',
      'YYYYY',
      '.YYY.',
      'Y...Y'
    ];
    const NOTE = [
      '..WW',
      '..W.',
      '..W.',
      'WWW.',
      'WW..'
    ];

    let hp = MAX_HP;
    let soul, bullets, elapsed, last, spawnClock, invuln, raf;

    function setHp(v) {
      hp = Math.max(0, v);
      hpFill.style.width = (hp / MAX_HP * 100) + '%';
      hpText.textContent = hp + ' / ' + MAX_HP;
    }

    function drawMap(map, x, y, color) {
      ctx.fillStyle = color;
      map.forEach((row, r) => [...row].forEach((c, col) => {
        if (c !== '.') ctx.fillRect(Math.round(x) + col, Math.round(y) + r, 1, 1);
      }));
    }

    function startBattle() {
      mode = 'battle';
      menuBtns.forEach(b => b.disabled = true);
      dialogBox.hidden = true;
      battleEl.hidden = false;
      setHp(MAX_HP);
      soul = { x: SIZE / 2 - 3, y: SIZE / 2 - 3 };
      bullets = [];
      elapsed = 0;
      spawnClock = 0;
      invuln = 0;
      last = performance.now();
      document.getElementById('quitBtn').focus();
      raf = requestAnimationFrame(tick);
    }

    function spawn() {
      const phase = elapsed < 5 ? 0 : elapsed < 10 ? 1 : 2;
      const speedUp = 1 + elapsed / 30;
      if (phase === 0 || (phase === 2 && Math.random() < 0.5)) {
        bullets.push({ map: STAR, color: '#ffe23d', w: 5, h: 5, x: Math.random() * (SIZE - 5), y: -6, vx: 0, vy: (38 + Math.random() * 22) * speedUp });
      } else if (phase === 1 || Math.random() < 0.6) {
        const fromLeft = Math.random() < 0.5;
        bullets.push({ map: NOTE, color: '#ffffff', w: 4, h: 5, x: fromLeft ? -5 : SIZE + 1, y: 6 + Math.random() * (SIZE - 16), vx: (fromLeft ? 1 : -1) * (42 + Math.random() * 20) * speedUp, vy: 0 });
      } else {
        const x = Math.random() < 0.5 ? 0 : SIZE - 5;
        bullets.push({ map: STAR, color: '#ffe23d', w: 5, h: 5, x, y: -6, vx: (x === 0 ? 1 : -1) * 30 * speedUp, vy: 40 * speedUp });
      }
    }

    function tick(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      elapsed += dt;

      // 하트 움직이기
      const speed = 70;
      let dx = 0, dy = 0;
      if (held.arrowleft || held.a) dx -= 1;
      if (held.arrowright || held.d) dx += 1;
      if (held.arrowup || held.w) dy -= 1;
      if (held.arrowdown || held.s) dy += 1;
      soul.x = Math.min(SIZE - 7, Math.max(0, soul.x + dx * speed * dt));
      soul.y = Math.min(SIZE - 6, Math.max(0, soul.y + dy * speed * dt));

      // 공격 만들기
      spawnClock -= dt;
      if (spawnClock <= 0) { spawn(); spawnClock = Math.max(0.16, 0.42 - elapsed * 0.016); }

      // 움직이고 부딪혔는지 확인
      invuln = Math.max(0, invuln - dt);
      bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
      bullets = bullets.filter(b => b.x > -10 && b.x < SIZE + 10 && b.y < SIZE + 10);
      if (invuln === 0) {
        const hit = bullets.find(b => soul.x + 1 < b.x + b.w && soul.x + 6 > b.x && soul.y + 1 < b.y + b.h && soul.y + 5 > b.y);
        if (hit) {
          setHp(hp - 4);
          invuln = 1;
          beep(140, 0.15, 'sawtooth', 0.06);
          bullets.splice(bullets.indexOf(hit), 1);
        }
      }

      // 그리기
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, SIZE, SIZE);
      bullets.forEach(b => drawMap(b.map, b.x, b.y, b.color));
      if (invuln === 0 || Math.floor(invuln * 10) % 2 === 0) drawMap(HEART, soul.x, soul.y, '#ff1a1a');

      timeLeftEl.textContent = '남은 시간 ' + Math.max(0, Math.ceil(DURATION - elapsed));

      if (hp <= 0) return endBattle('lose');
      if (elapsed >= DURATION) return endBattle('win');
      raf = requestAnimationFrame(tick);
    }

    function endBattle(result) {
      cancelAnimationFrame(raf);
      Object.keys(held).forEach(k => held[k] = false);
      battleEl.hidden = true;
      dialogBox.hidden = false;
      menuBtns.forEach(b => b.disabled = false);
      mode = 'menu';
      menuBtns[menuIndex].focus();
      if (result === 'win') {
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12), i * 110));
        say(['* 별을 전부 피했다!', '* 정한별이 감탄한다.', '* 정한별과 친구가 되었다!']);
      } else if (result === 'lose') {
        sprite.classList.remove('hurt');
        void sprite.offsetWidth;
        sprite.classList.add('hurt');
        say(['* 별에 너무 많이 맞았다...', '* 하지만 포기하지 않는다.', '* (대결을 다시 눌러 도전해 보세요!)'], () => setHp(MAX_HP));
      } else {
        say('* 대결을 그만두었다.', () => setHp(MAX_HP));
      }
    }

    document.getElementById('quitBtn').addEventListener('click', () => endBattle('quit'));

    // 손가락(또는 마우스)으로 끌어서 하트 움직이기
    let drag = null;
    arena.addEventListener('pointerdown', (e) => {
      if (mode !== 'battle') return;
      arena.setPointerCapture(e.pointerId);
      drag = { x: e.clientX, y: e.clientY };
    });
    arena.addEventListener('pointermove', (e) => {
      if (!drag || mode !== 'battle') return;
      const scale = SIZE / arena.getBoundingClientRect().width;
      soul.x = Math.min(SIZE - 7, Math.max(0, soul.x + (e.clientX - drag.x) * scale));
      soul.y = Math.min(SIZE - 6, Math.max(0, soul.y + (e.clientY - drag.y) * scale));
      drag = { x: e.clientX, y: e.clientY };
    });
    ['pointerup', 'pointercancel'].forEach(t => arena.addEventListener(t, () => { drag = null; }));

    // ───────── 시작 ─────────
    say(['* 야생의 정한별이 나타났다!', '* 메뉴에서 무엇을 할지 골라 보세요.']);
  </script>
</body>
</html>
